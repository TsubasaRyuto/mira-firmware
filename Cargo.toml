[package]
name = "mira-firmware"
version = "0.1.0"
edition = "2024"

[features]
default = ["keyboard-mira", "split", "left"]
keyboard-mira = []
split = []
left = []
right = []


[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-1_000_000"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl", "rp2040"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = { version = "0.1.0" }

cortex-m-rt = "0.7.3"
cortex-m = "0.7"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
panic-probe = { version = "0.3", features = ["print-defmt"] }
rp2040-boot2 = "0.3"
usb-device = "0.3.2"
usbd-hid = "0.10.0"
static_cell = "2.1"
portable-atomic = { version = "1.11", features = ["critical-section"] }
embedded-io-async = "0.7.0"
defmt = "0.3"
defmt-rtt = "0.4"
itoa = "1"

[profile.dev]
panic = "abort"
opt-level = "s"
debug = 2
lto = "off"
codegen-units = 1

[profile.release]
panic = "abort"
opt-level = "s"
lto = "fat"
codegen-units = 1
